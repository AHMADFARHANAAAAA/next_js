<!DOCTYPE html>
<html>
<head>
    <title>Clear Column Width Cache</title>
</head>
<body>
    <h1>Clear Leads Table Column Width Cache</h1>
    <button onclick="clearCache()">Clear Cache</button>
    <p id="result"></p>
    
    <script>
        function clearCache() {
            localStorage.removeItem('leadsTableColumnWidths');
            document.getElementById('result').innerHTML = '✓ Cache cleared! Please refresh your leads page.';
            document.getElementById('result').style.color = 'green';
        }
    </script>
</body>
</html>
